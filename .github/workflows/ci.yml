name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cs-beta-actions_20260305

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so commitlint can lint the PR commit range.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Prefetch vendored dependencies
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - run: npm ci
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11 "$RUNNER_TEMP"
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      # Bundle once before fan-out. Typecheck runs exactly once in the queue.
      - run: npm run bundle
      # Keep at most two checks active on the two-vCPU runner. Failures aggregate
      # under ::group:: logs so one pass still shows every result.
      - name: Run gates
        run: |
          set -uo pipefail
          declare -A pid=()
          declare -A result=()
          declare -a names=()
          MAX_PARALLEL_GATES=2
          finish_one() {
            local finished_pid status n
            if wait -n -p finished_pid "${pid[@]}"; then status=0; else status=$?; fi
            for n in "${!pid[@]}"; do
              if [ "${pid[$n]}" = "$finished_pid" ]; then
                result[$n]=$status
                unset 'pid[$n]'
                return
              fi
            done
          }
          run() {
            while [ "${#pid[@]}" -ge "$MAX_PARALLEL_GATES" ]; do finish_one; done
            local n=$1; shift
            names+=("$n")
            ( "$@" ) >"$RUNNER_TEMP/$n.log" 2>&1 & pid[$n]=$!
          }

          run lint       npm run lint
          run test       npm test
          run typecheck  npm run typecheck
          run dist-shape npm run verify:dist:shape
          run actionlint "$ACTIONLINT_BIN"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run commitlint npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}"
          fi

          while [ "${#pid[@]}" -gt 0 ]; do finish_one; done
          fail=0
          for n in "${names[@]}"; do
            if [ "${result[$n]}" -eq 0 ]; then echo "gate:$n=pass"; else echo "gate:$n=fail"; fail=1; fi
          done
          for n in "${names[@]}"; do
            echo "::group::$n"; cat "$RUNNER_TEMP/$n.log"; echo "::endgroup::"
          done
          exit $fail
      - name: Git smart-HTTP transport lane
        # Budgeted hermetic lane (cap 47s wall-clock): proves the repo
        # mutation push path with a REAL git client against the real
        # `git http-backend` wire protocol -- x-access-token Basic auth and
        # token candidate ordering, reserved-character token encoding,
        # missing-branch creation, concurrent-advance fetch/rebase
        # reconciliation, non-retryable permission denial -- with no live git
        # host, no container.
        run: |
          set -euo pipefail
          start=$SECONDS
          npm run test:emulator:git
          elapsed=$((SECONDS - start))
          echo "git transport lane wall-clock: ${elapsed}s (cap 47s)"
          if [ "$elapsed" -gt 47 ]; then
            echo "::error::git transport lane exceeded its 47s budget (${elapsed}s)"
            exit 1
          fi
      - name: Ensure clean tracked tree outside dist
        run: |
          set -euo pipefail
          outside=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file="${line:3}"
            case "$file" in
              dist/*) ;;
              *) outside+=("$file") ;;
            esac
          done < <(git status --porcelain)
          if [ "${#outside[@]}" -gt 0 ]; then
            echo "Unexpected changes outside dist/:"
            printf '%s\n' "${outside[@]}"
            exit 1
          fi
      - name: Write dist manifest
        run: |
          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const lock = readFileSync('package-lock.json');
          writeFileSync(
            'dist-manifest.json',
            `${JSON.stringify(
              {
                repository: process.env.GITHUB_REPOSITORY,
                pull_request: Number(process.env.GITHUB_EVENT_PULL_REQUEST_NUMBER || 0),
                head_sha: process.env.GITHUB_EVENT_NAME === "pull_request" ? JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).pull_request.head.sha : process.env.GITHUB_SHA,
                lock_hash: createHash('sha256').update(lock).digest('hex'),
              },
              null,
              2,
            )}\n`,
          );
          NODE
        env:
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
      - name: Upload candidate dist
        uses: actions/upload-artifact@v7
        with:
          name: candidate-dist
          path: |
            dist/
            dist-manifest.json

  dist-parity:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Prefetch vendored dependencies
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - run: npm ci
      - run: npm run bundle
      - run: npm run verify:dist:parity
      - name: Upload expected dist on mismatch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: expected-dist
          path: dist/

  windows:
    name: Windows gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: windows-node-modules
        with:
          path: node_modules
          key: Windows/node-24/exact-${{ hashFiles('package-lock.json') }}
      - name: Prefetch vendored dependencies
        if: steps.windows-node-modules.outputs.cache-hit != 'true'
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - name: Install dependencies
        if: steps.windows-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: node --run test

  ready:
    needs: [gate, dist-parity, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs succeeded
        run: |
          echo "gate=${{ needs.gate.result }}"
          echo "dist-parity=${{ needs.dist-parity.result }}"
          echo "windows=${{ needs.windows.result }}"
          for result in "${{ needs.gate.result }}" "${{ needs.dist-parity.result }}" "${{ needs.windows.result }}"; do
            if [ "$result" != "success" ]; then
              echo "CI not ready: one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "CI ready"
