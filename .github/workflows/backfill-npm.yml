name: Backfill npm

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Ordered space-separated immutable tags, oldest first
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish immutable release artifacts to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; fi
          PKG='@postman-cs/onboarding-repo-sync'
          for TAG in ${{ inputs.tags }}; do
            DIR="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release.tgz' --dir "$DIR"
            TARBALL="$DIR/release.tgz"
            PACKAGE_JSON="$DIR/package.json"
            tar -xOf "$TARBALL" package/package.json > "$PACKAGE_JSON"
            test "$(node -p "require(process.argv[1]).name" "$PACKAGE_JSON")" = "$PKG"
            test "$(node -p "require(process.argv[1]).version" "$PACKAGE_JSON")" = "${TAG#v}"
            if npm view "$PKG@${TAG#v}" version >/dev/null 2>&1; then
              echo "::notice::$PKG@${TAG#v} already exists; skipping"
            else
              npm publish "$TARBALL" --provenance --access public --tag backfill
            fi
          done
          LATEST="$(npm view "$PKG" versions --json | node -e 'let input=""; process.stdin.on("data", c => input += c).on("end", () => { const versions = JSON.parse(input); const list = Array.isArray(versions) ? versions : [versions]; const parsed = list.filter(v => /^\d+\.\d+\.\d+$/.test(v)).sort((a, b) => { const aa = a.split(".").map(Number), bb = b.split(".").map(Number); return aa[0] - bb[0] || aa[1] - bb[1] || aa[2] - bb[2]; }); if (!parsed.length) process.exit(1); console.log(parsed.at(-1)); });')"
          npm dist-tag add "$PKG@$LATEST" latest
