name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_kind: ${{ steps.release_tag.outputs.release_kind }}
      npm_publish: ${{ steps.release_tag.outputs.npm_publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Classify release tag
        id: release_tag
        run: node scripts/release-policy.mjs classify

  verify-package:
    needs: classify
    if: ${{ needs.classify.outputs.release_kind == 'immutable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tgz_sha256: ${{ steps.artifact-digests.outputs.release_tgz_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Prefetch vendored dependencies
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - run: npm ci
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11 "$RUNNER_TEMP"
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - run: npm run bundle
      - name: Run gates
        run: |
          set -uo pipefail
          declare -A pid=() result=(); declare -a names=(); MAX_PARALLEL_GATES=2
          finish_one() { local finished_pid status n; if wait -n -p finished_pid "${pid[@]}"; then status=0; else status=$?; fi; for n in "${!pid[@]}"; do if [ "${pid[$n]}" = "$finished_pid" ]; then result[$n]=$status; unset 'pid[$n]'; return; fi; done; }
          run() { while [ "${#pid[@]}" -ge "$MAX_PARALLEL_GATES" ]; do finish_one; done; local n=$1; shift; names+=("$n"); ( "$@" ) >"$n.log" 2>&1 & pid[$n]=$!; }
          run lint npm run lint; run test npm test; run typecheck npm run typecheck; run dist npm run verify:dist:assert; run actionlint "$ACTIONLINT_BIN"
          while [ "${#pid[@]}" -gt 0 ]; do finish_one; done; fail=0
          for n in "${names[@]}"; do if [ "${result[$n]}" -eq 0 ]; then echo "gate:$n=pass"; else echo "gate:$n=fail"; fail=1; fi; echo "::group::$n"; cat "$n.log"; echo '::endgroup::'; done
          exit $fail
      - name: Pack npm artifact
        run: |
          mkdir release-artifacts
          npm pack --pack-destination release-artifacts
          mv release-artifacts/*.tgz release-artifacts/release.tgz
      - name: Record immutable package digest
        id: artifact-digests
        run: echo "release_tgz_sha256=$(sha256sum release-artifacts/release.tgz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Build self-contained SEA binary
        run: bash scripts/build-sea.sh
      - name: Smoke test SEA binary with an empty environment
        run: |
          VERSION="$(node -p "require('./package.json').version")"; BIN="$PWD/build/sea/postman-repo-sync-${VERSION}-linux-x64"
          out="$(env -i PATH=/nonexistent "$BIN" 2>&1 || true)"; echo "$out"
          echo "$out" | grep -qE 'is missing or invalid|is required'
          test "$(env -i PATH=/nonexistent "$BIN" --version)" = "$VERSION"
          test "$(NODE_OPTIONS='--this-flag-does-not-exist' "$BIN" --version)" = "$VERSION"
      - name: Smoke test SEA proxy routing
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/assert-sea-proxy.mjs "$PWD/build/sea/postman-repo-sync-${VERSION}-linux-x64" iapub.postman.co:443 --postman-access-token proxy-smoke-token --project-name proxy-smoke --workspace-id proxy-workspace --repo-write-mode none --generate-ci-workflow false
      - name: Stage release manifest
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SEA="postman-repo-sync-${VERSION}-linux-x64"
          cp "build/sea/${SEA}" "build/sea/${SEA}.sha256" release-artifacts/
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const pkg = require('./package.json');
          const sea = `postman-repo-sync-${pkg.version}-linux-x64`;
          const paths = ['release.tgz', sea, `${sea}.sha256`];
          const sha256 = (path) => createHash('sha256').update(readFileSync(`release-artifacts/${path}`)).digest('hex');
          writeFileSync('release-artifacts/release-manifest.json', JSON.stringify({
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            commit_sha: process.env.GITHUB_SHA,
            tag: process.env.GITHUB_REF_NAME,
            package_name: pkg.name,
            package_version: pkg.version,
            artifacts: paths.map((path) => ({ path, sha256: sha256(path) }))
          }, null, 2));
          NODE
      - name: Verify release artifact contract
        run: node scripts/verify-release-artifacts.mjs release-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: [classify, verify-package]
    if: ${{ needs.classify.outputs.release_kind == 'immutable' && needs.verify-package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.npm-publish.outputs.published }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
      - name: Verify staged release artifacts
        run: |
          set -euo pipefail
          EXPECTED_SHA256='68001e833a50ff552932d1d01ae7483fb0d3a6410dc7fd05353f3e481f188499'
          VERIFIER="$RUNNER_TEMP/verify-release-artifacts.mjs"
          tar -xOf release-artifacts/release.tgz package/scripts/verify-release-artifacts.mjs > "$VERIFIER"
          ACTUAL_SHA256="$(sha256sum "$VERIFIER" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          node "$VERIFIER" release-artifacts
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/release.tgz
            release-artifacts/release-manifest.json
            release-artifacts/postman-repo-sync-*-linux-x64
            release-artifacts/postman-repo-sync-*-linux-x64.sha256
      - name: Publish npm package
        id: npm-publish
        continue-on-error: true
        run: |
          set -euo pipefail
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "published=false" >> "$GITHUB_OUTPUT"
          PKG=$(node -p "require('./release-artifacts/release-manifest.json').package_name")
          VERSION=$(node -p "require('./release-artifacts/release-manifest.json').package_version")
          SRI=$(node -e "const fs=require('fs'),crypto=require('crypto');console.log('sha512-'+crypto.createHash('sha512').update(fs.readFileSync('release-artifacts/release.tgz')).digest('base64'))")
          set +e
          npm view "$PKG@$VERSION" dist.integrity >/tmp/integrity 2>/tmp/npm-view.err
          NPM_VIEW_STATUS=$?
          set -e
          if [ "$NPM_VIEW_STATUS" -eq 0 ]; then
            test "$(tr -d '[:space:]' </tmp/integrity)" = "$SRI" || {
              echo '::error::Published npm integrity differs from staged tarball'
              exit 1
            }
            echo '::notice::npm version already published with matching integrity'
          else
            if grep -qE '^npm (error|ERR!) code E404' /tmp/npm-view.err || grep -qE '^npm error 404\b' /tmp/npm-view.err; then
              npm publish ./release-artifacts/release.tgz --provenance --access public
            else
              echo '::error::npm view failed with a non-E404 error; refusing to publish or mutate GitHub'
              cat /tmp/npm-view.err >&2 || true
              exit 1
            fi
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify npm registry identity
        if: steps.npm-publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./release-artifacts/release-manifest.json').package_name")
          VERSION=$(node -p "require('./release-artifacts/release-manifest.json').package_version")
          SRI=$(node -e "const fs=require('fs'),crypto=require('crypto');console.log('sha512-'+crypto.createHash('sha512').update(fs.readFileSync('release-artifacts/release.tgz')).digest('base64'))")
          # A first publish of a new package name takes minutes to become readable.
          # Measured 309s (azure 1.5.1) and 307s (gcp 1.3.1) on 2026-08-25; a later
          # version of an existing package resolved in ~20s. 40 x 15s = 10 minutes.
          set +e
          for attempt in $(seq 1 40); do
            npm view "$PKG@$VERSION" dist.integrity >/tmp/integrity 2>/tmp/npm-view.err
            NPM_VIEW_STATUS=$?
            if [ "$NPM_VIEW_STATUS" -eq 0 ]; then break; fi
            echo "::notice::registry read-back attempt $attempt/40 has not resolved yet"
            if [ "$attempt" -lt 40 ]; then sleep 15; fi
          done
          set -e
          test "$NPM_VIEW_STATUS" -eq 0 || { echo '::error::npm package is not visible after a successful publish'; exit 1; }
          test "$(tr -d '[:space:]' </tmp/integrity)" = "$SRI" || {
            echo '::error::Published npm integrity differs from staged tarball'
            exit 1
          }
      - name: Report npm publish skipped
        if: steps.npm-publish.outputs.published != 'true'
        run: |
          PKG=$(node -p "require('./release-artifacts/release-manifest.json').package_name")
          VERSION=$(node -p "require('./release-artifacts/release-manifest.json').package_version")
          MESSAGE="npm publish for $PKG@$VERSION did not complete (OIDC trusted publisher or registry error); GitHub Release remains authoritative; rerun this release after trusted publishing is restored"
          echo "::warning::$MESSAGE"
          echo "::warning::$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

  verify-release-e2e:
    needs: [classify, verify-package, publish]
    if: ${{ !cancelled() && needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.verifier.outputs.e2e_outcome }}
      correlation_id: ${{ steps.verifier.outputs.e2e_correlation_id }}
      manifest_sha256: ${{ steps.verifier.outputs.e2e_manifest_sha256 }}
      provider_commit: ${{ steps.verifier.outputs.e2e_provider_commit }}
      provider_tag: ${{ steps.verifier.outputs.e2e_provider_tag }}
      workflow_run_id: ${{ steps.verifier.outputs.e2e_workflow_run_id }}
      run_url: ${{ steps.verifier.outputs.e2e_run_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Dispatch and await exact correlated E2E verifier
        id: verifier
        env:
          E2E_DISPATCH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          E2E_GATE_MODE: enforce
          E2E_GATE_ACTION: postman-repo-sync-action
          E2E_GATE_SUITE: branch-aware
          E2E_GATE_REF: ${{ github.ref_name }}
          E2E_GATE_RELEASE_COMMIT: ${{ github.sha }}
          E2E_GATE_SOURCE_DIGEST: ${{ needs.verify-package.outputs.release_tgz_sha256 }}
          E2E_GATE_PROVIDER_TAG: e2e-provider-v1.2.0
          E2E_GATE_PROVIDER_COMMIT: 53c5d10093b7dafb165d3caafbe3f1d70dec687d
          E2E_GATE_PROVIDER_SOURCE_DIGEST: 8c7ee211fccd2869f3901fcbc5ed154d6dea8e3d0d7d2e5312f6c0b57b4f6b78
          E2E_GATE_PEER_TAGS: '{"postman-cs/postman-api-onboarding-action":"v3.5.8","postman-cs/postman-bootstrap-action":"v2.21.9","postman-cs/postman-insights-onboarding-action":"v2.5.2","postman-cs/postman-resolve-service-token-action":"v2.2.4","postman-cs/postman-smoke-flow-action":"v3.7.4"}'
        run: node .github/scripts/verify-e2e-release.mjs

  advance-major-alias:
    needs: [classify, publish, verify-release-e2e]
    if: ${{ !cancelled() && needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' && needs.verify-release-e2e.result == 'success' && needs.verify-release-e2e.outputs.outcome == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
          fetch-depth: 1
      - name: Advance rolling major alias without regression
        env:
          VERIFIED_E2E_MANIFEST_SHA256: ${{ needs.verify-release-e2e.outputs.manifest_sha256 }}
          VERIFIED_E2E_PROVIDER_COMMIT: ${{ needs.verify-release-e2e.outputs.provider_commit }}
          VERIFIED_E2E_PROVIDER_TAG: ${{ needs.verify-release-e2e.outputs.provider_tag }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_E2E_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::verified E2E manifest digest is missing or invalid'
            exit 1
          }
          [ "$VERIFIED_E2E_PROVIDER_TAG" = 'e2e-provider-v1.2.0' ] || {
            echo '::error::verified E2E provider tag mismatch'
            exit 1
          }
          [ "$VERIFIED_E2E_PROVIDER_COMMIT" = '53c5d10093b7dafb165d3caafbe3f1d70dec687d' ] || {
            echo '::error::verified E2E provider commit mismatch'
            exit 1
          }
          CANDIDATE="$(node -p "require('./package.json').version")"
          MAJOR="v${CANDIDATE%%.*}"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$MAJOR" >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 --no-tags origin "refs/tags/$MAJOR:refs/tags/$MAJOR"
            CURRENT="$(git show "$MAJOR:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
            if node --input-type=module -e "import { isSemverOlder } from './scripts/release-policy.mjs'; process.exit(isSemverOlder(process.argv[1], process.argv[2]) ? 0 : 1)" "$CANDIDATE" "$CURRENT"; then
              echo "::notice::Candidate $CANDIDATE is older than current alias $MAJOR ($CURRENT); not moving it."
              exit 0
            fi
          elif [ "$status" -ne 2 ]; then
            echo "::error::failed to probe rolling alias $MAJOR (git ls-remote exit $status)"
            exit 1
          fi
          RELEASE_TAG_REF="refs/tags/$GITHUB_REF_NAME"
          REMOTE_RELEASE_REFS="$(git ls-remote --exit-code --tags origin "$RELEASE_TAG_REF" "${RELEASE_TAG_REF}^{}")" || {
            echo "::error::failed to re-resolve immutable release tag $GITHUB_REF_NAME"
            exit 1
          }
          REMOTE_RELEASE_TAG=''
          REMOTE_RELEASE_PEELED=''
          while IFS=$'\t' read -r object ref; do
            if [ "$ref" = "$RELEASE_TAG_REF" ]; then
              [ -z "$REMOTE_RELEASE_TAG" ] || { echo '::error::duplicate immutable release tag ref'; exit 1; }
              REMOTE_RELEASE_TAG="$object"
            elif [ "$ref" = "${RELEASE_TAG_REF}^{}" ]; then
              [ -z "$REMOTE_RELEASE_PEELED" ] || { echo '::error::duplicate peeled release tag ref'; exit 1; }
              REMOTE_RELEASE_PEELED="$object"
            else
              echo "::error::unexpected ref while resolving immutable release tag: $ref"
              exit 1
            fi
          done <<< "$REMOTE_RELEASE_REFS"
          [[ "$REMOTE_RELEASE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::immutable release tag did not resolve to an object'; exit 1; }
          REMOTE_RELEASE_COMMIT="${REMOTE_RELEASE_PEELED:-$REMOTE_RELEASE_TAG}"
          [[ "$REMOTE_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::immutable release tag did not peel to a commit'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::release workflow SHA is invalid'; exit 1; }
          [ "$REMOTE_RELEASE_COMMIT" = "$GITHUB_SHA" ] || {
            echo "::error::immutable release tag moved: expected $GITHUB_SHA, resolved $REMOTE_RELEASE_COMMIT"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa "$MAJOR" -m "Rolling $MAJOR alias -> $GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "$MAJOR" --force

  # GITHUB_TOKEN-created Release runs never emit workflow_run cascades; the
  # composite's daily cron remains the backstop when App secrets are absent.
  notify-composite:
    needs: [classify, publish, verify-release-e2e, advance-major-alias]
    if: ${{ !cancelled() && needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' && needs.verify-release-e2e.result == 'success' && needs.verify-release-e2e.outputs.outcome == 'success' && needs['advance-major-alias'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint composite-scoped App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUITE_PIN_BOT_APP_ID }}
          private-key: ${{ secrets.SUITE_PIN_BOT_PRIVATE_KEY }}
          owner: postman-cs
          repositories: postman-api-onboarding-action

      - name: Dispatch sibling-release to the composite
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::App token unavailable (secrets missing or mint failed); the composite's daily cron will pick this release up."
            exit 0
          fi
          gh api repos/postman-cs/postman-api-onboarding-action/dispatches \
            -f event_type=sibling-release \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[run]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
